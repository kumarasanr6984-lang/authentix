<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="authentixBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e3a8a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- High-Definition Blue Squircle Base -->
  <rect 
    x="6" 
    y="6" 
    width="116" 
    height="116" 
    rx="30" 
    fill="url(#authentixBlue)"
    filter="url(#subtleShadow)"
  />

  <!-- Subtle Top Rim Light -->
  <rect 
    x="7" 
    y="7" 
    width="114" 
    height="114" 
    rx="29" 
    fill="none" 
    stroke="#93c5fd" 
    stroke-width="1.5" 
    stroke-opacity="0.4"
  />

  <!-- Shield Contour -->
  <path 
    d="M64 33 C77 33 87 36.5 93 42 C93 64 81 83 64 95 C47 83 35 64 35 42 C41 36.5 51 33 64 33 Z" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="7.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Verification Checkmark -->
  <path 
    d="M53 63.5 L60.5 71 L75 54.5" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="7.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />
</svg>
